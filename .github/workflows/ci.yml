name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .tool-versions
          cache: npm

      - name: Install Aikido safe chain
        run: curl -fsSL https://github.com/AikidoSec/safe-chain/releases/latest/download/install-safe-chain.sh | sh -s -- --ci

      - name: Install dependencies
        run: npm ci

      - name: Format check
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run type-check

      - name: Test
        timeout-minutes: 5
        run: npm run test:run

      - name: Build
        run: npm run build

      - name: Check that dist is committed
        run: |
          if [ -n "$(git status --porcelain -- dist)" ]; then
            git status --short -- dist
            echo "::error::dist/ is out of date. Run npm run build and commit the result."
            exit 1
          fi

  e2e:
    name: End to end (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .tool-versions
          cache: npm

      - name: Install Aikido safe chain
        run: curl -fsSL https://github.com/AikidoSec/safe-chain/releases/latest/download/install-safe-chain.sh | sh -s -- --ci

      # The mock control plane reads zips with yauzl, as the real one does.
      - name: Install dependencies
        run: npm ci

      - name: Start a mock control plane behind a flaky proxy
        run: |
          node test/mock-server.ts --port 8787 --flaky \
            --require-header "CF-Access-Client-Id: e2e.access" \
            --require-header "CF-Access-Client-Secret: e2e-secret" \
            > "$RUNNER_TEMP/mock-server.log" 2>&1 &
          for attempt in $(seq 1 50); do
            curl -sf http://127.0.0.1:8787/__health > /dev/null && exit 0
            sleep 0.2
          done
          cat "$RUNNER_TEMP/mock-server.log"
          exit 1

      - name: Lay out an archive
        run: |
          dsyms="$RUNNER_TEMP/MyApp.xcarchive/dSYMs"
          mkdir -p "$dsyms/Large.app.dSYM/Contents/Resources/DWARF"
          unzip -q test/fixtures/CrashDemo.dSYM.zip -d "$dsyms"
          head -c 3145728 /dev/urandom > "$dsyms/Large.app.dSYM/Contents/Resources/DWARF/Large"

      - name: Upload dSYMs
        id: upload
        uses: ./
        with:
          url: http://127.0.0.1:8787
          api_key: aide_test
          dsym_paths: |
            ${{ runner.temp }}/MyApp.xcarchive
            test/fixtures/*.zip
          headers: |
            CF-Access-Client-Id: e2e.access
            CF-Access-Client-Secret: e2e-secret
          chunk_size: 1

      - name: Check the outputs and requests
        env:
          UPLOADS: ${{ steps.upload.outputs.uploads }}
          UUIDS: ${{ steps.upload.outputs.uuids }}
        run: |
          node --input-type=module --eval '
            const uploads = JSON.parse(process.env.UPLOADS);
            const names = uploads.flatMap((upload) => upload.dsyms.map((dsym) => dsym.bundleName)).sort();
            const expected = ["CrashDemo.dSYM", "CrashDemo.dSYM", "Large.app.dSYM"];
            if (JSON.stringify(names) !== JSON.stringify(expected)) throw new Error(`Unexpected dSYMs: ${names}`);
            if (!process.env.UUIDS.trim()) throw new Error("The uuids output is empty");
            const requests = await (await fetch("http://127.0.0.1:8787/__requests")).json();
            const patches = requests.filter((request) => request.method === "PATCH");
            if (patches.some((request) => request.bodyBytes > 1024 * 1024)) throw new Error("A chunk was larger than chunk_size");
            console.log(`Uploaded ${names.length} dSYMs in ${patches.length} chunks over ${requests.length} requests`);'

      - name: Dry run
        uses: ./
        with:
          dsym_paths: ${{ runner.temp }}/MyApp.xcarchive
          dry_run: true
